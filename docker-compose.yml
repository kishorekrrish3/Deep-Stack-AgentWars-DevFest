version: '3.8'

services:
  logistics-dispatcher:
    build: .
    container_name: logistics-handler-adk-ultrafast
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - API_PORT=8000
      - FAST_CACHE_ENABLED=true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
