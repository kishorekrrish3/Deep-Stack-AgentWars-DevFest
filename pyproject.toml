[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dispatchgraph-logistics"
version = "2.0.0"
description = "A grounded AI logistics dispatch prototype built with Google ADK, FastAPI, and deterministic tools."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Logistics AI Engineering Team" }
]
dependencies = [
    "google-adk>=2.12.0",
    "google-genai>=2.31.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "pydantic>=2.8.0",
    "python-dotenv>=1.0.1",
    "python-multipart>=0.0.9",
    "pillow>=10.4.0",
    "reportlab>=4.2.0"
]

[tool.setuptools.packages.find]
include = ["logistics_handler*"]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0"
]

[project.scripts]
dispatchgraph = "logistics_handler.cli:main"
logistics-dispatcher = "logistics_handler.cli:main"
